name: Build Signed Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Gradle wrapper (if missing)
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating it..."
            gradle wrapper --gradle-version 8.5
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Inspect AdiveryListener signature (diagnostic)
        if: always()
        run: |
          AAR=$(find ~/.gradle/caches -name "sdk-4.9.0.aar" | head -n 1)
          if [ -z "$AAR" ]; then
            echo "Adivery AAR not found in cache"
          else
            echo "Found AAR: $AAR"
            mkdir -p /tmp/adivery_aar
            unzip -o -q "$AAR" -d /tmp/adivery_aar
            javap -p -classpath /tmp/adivery_aar/classes.jar com.adivery.sdk.AdiveryListener || true
          fi

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParsPing-release-signed
          path: app/build/outputs/apk/release/*.apk
